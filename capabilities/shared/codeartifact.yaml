naftiko: 1.0.0-alpha1
info:
  label: Amazon CodeArtifact
  description: Managed artifact repository service for storing, publishing, and sharing software packages across teams.
  tags:
  - Amazon
  - AWS
  - Artifact Repository
  - Package Management
  - DevOps
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: codeartifact
    baseUri: http://codeartifact.us-east-1.amazonaws.com
    description: Amazon CodeArtifact REST API for managing artifact repositories, packages, and domains.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_AUTH_TOKEN}}'
      placement: header
    resources:
    - name: repository
      path: /v1/repository
      description: Operations for managing repository resources in CodeArtifact.
      operations:
      - name: associateExternalConnection
        method: POST
        description: Amazon CodeArtifact Associate External Connection
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: The name of the domain that contains the repository.
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository to which the external connection is added. '
        - name: external-connection
          in: query
          type: string
          required: true
          description: '<p> The name of the external connection to add to the repository. The following values are supported: </p> <ul> <li> <p> <code>public:npmjs</code> - for the npm public repository.
            </p> </li> <li> <p> <code>public:nuget-org</code> - for the NuGet Gallery. </p> </li> <li> <p> <code>public:pypi</code> - for the Python Package Index. </p> </li> <li> <p> <code>public:maven-central</code>
            - for Maven Central. </p> </li> <li> <p> <code>public:maven-googleandroid</code> - for the Google Android repository. </p> </li> <li> <p> <code>public:maven-gradleplugins</code> - for the Gradle
            plugins repository. </p> </li> <li> <p> <code>public:maven-commonsware</code> - for the CommonsWare Android repository. </p> </li> <li> <p> <code>public:maven-clojars</code> - for the Clojars
            repository. </p> </li> </ul>'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: disassociateExternalConnection
        method: DELETE
        description: Amazon CodeArtifact Disassociate External Connection
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: 'The name of the domain that contains the repository from which to remove the external repository. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: 'The name of the repository from which the external connection will be removed. '
        - name: external-connection
          in: query
          type: string
          required: true
          description: 'The name of the external connection to be removed from the repository. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createRepository
        method: POST
        description: Amazon CodeArtifact Create Repository
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the created repository. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository to create. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: deleteRepository
        method: DELETE
        description: Amazon CodeArtifact Delete Repository
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository to delete. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository to delete. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describeRepository
        method: GET
        description: Amazon CodeArtifact Describe Repository
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository to describe. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' A string that specifies the name of the requested repository. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateRepository
        method: PUT
        description: Amazon CodeArtifact Update Repository
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain associated with the repository to update. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository to update. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: deleteRepositoryPermissionsPolicy
        method: DELETE
        description: Amazon CodeArtifact Delete Repository Permissions Policy
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository associated with the resource policy to be deleted. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that is associated with the resource policy to be deleted '
        - name: policy-revision
          in: query
          type: string
          required: false
          description: " The revision of the repository's resource policy to be deleted. This revision is used for optimistic locking, which prevents others from accidentally overwriting your changes to
            the repository's resource policy. "
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getRepositoryEndpoint
        method: GET
        description: Amazon CodeArtifact Get Repository Endpoint
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain that contains the repository. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository. '
        - name: format
          in: query
          type: string
          required: true
          description: ' Returns which endpoint of a repository to return. A repository has one endpoint for each package format. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getRepositoryPermissionsPolicy
        method: GET
        description: Amazon CodeArtifact Get Repository Permissions Policy
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain containing the repository whose associated resource policy is to be retrieved. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository whose associated resource policy is to be retrieved. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putRepositoryPermissionsPolicy
        method: PUT
        description: Amazon CodeArtifact Put Repository Permissions Policy
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain containing the repository to set the resource policy on. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository to set the resource policy on. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
    - name: package
      path: /v1/package
      description: Operations for managing package resources in CodeArtifact.
      operations:
      - name: copyPackageVersions
        method: POST
        description: Amazon CodeArtifact Copy Package Versions
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the source and destination repositories. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: source-repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that contains the package versions to be copied. '
        - name: destination-repository
          in: query
          type: string
          required: true
          description: ' The name of the repository into which package versions are copied. '
        - name: format
          in: query
          type: string
          required: true
          description: ' The format of the package versions to be copied. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package versions to be copied. The package version component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The 
            namespace of a Maven package version is its <code>groupId</code>. The namespace is required when copying Maven package versions. </p> </li> <li> <p> The namespace of an npm package version
            is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet package versions do not contain a corresponding component, package versions of those formats do not have a namespace. </p> 
            </li> <li> <p> The namespace of a generic package is its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the package that contains the versions to be copied. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: deletePackage
        method: DELETE
        description: Amazon CodeArtifact Delete Package
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: The name of the domain that contains the package to delete.
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: The name of the repository that contains the package to delete.
        - name: format
          in: query
          type: string
          required: true
          description: The format of the requested package to delete.
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package to delete. The package component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace of a Maven 
            package is its <code>groupId</code>. The namespace is required when deleting Maven package versions. </p> </li> <li> <p> The namespace of an npm package is its <code>scope</code>.</p> 
            </li> <li> <p> Python and NuGet packages do not contain corresponding components, packages of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package 
            is its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: The name of the package to delete.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describePackage
        method: GET
        description: Amazon CodeArtifact Describe Package
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: The name of the domain that contains the repository that contains the package.
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: 'The name of the repository that contains the requested package. '
        - name: format
          in: query
          type: string
          required: true
          description: A format that specifies the type of the requested package.
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the requested package. The package component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace of a Maven 
            package is its <code>groupId</code>. The namespace is required when requesting Maven packages. </p> </li> <li> <p> The namespace of an npm package is its <code>scope</code>. </p> </li> 
            <li> <p> Python and NuGet packages do not contain a corresponding component, packages of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is 
            its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: The name of the requested package.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putPackageOriginConfiguration
        method: POST
        description: Amazon CodeArtifact Put Package Origin Configuration
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: The name of the domain that contains the repository that contains the package.
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: The name of the repository that contains the package.
        - name: format
          in: query
          type: string
          required: true
          description: A format that specifies the type of the package to be updated.
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package to be updated. The package component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace of a Maven 
            package is its <code>groupId</code>. </p> </li> <li> <p> The namespace of an npm package is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet packages do not contain a 
            corresponding component, packages of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: The name of the package to be updated.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: deletePackageVersions
        method: POST
        description: Amazon CodeArtifact Delete Package Versions
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the package to delete. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that contains the package versions to delete. '
        - name: format
          in: query
          type: string
          required: true
          description: ' The format of the package versions to delete. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package versions to be deleted. The package version component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The 
            namespace of a Maven package version is its <code>groupId</code>. The namespace is required when deleting Maven package versions. </p> </li> <li> <p> The namespace of an npm package 
            version is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet package versions do not contain a corresponding component, package versions of those formats do not have a 
            namespace. </p> </li> <li> <p> The namespace of a generic package is its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the package with the versions to delete. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: describePackageVersion
        method: GET
        description: Amazon CodeArtifact Describe Package Version
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository that contains the package version. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that contains the package version. '
        - name: format
          in: query
          type: string
          required: true
          description: ' A format that specifies the type of the requested package version. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the requested package version. The package version component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace 
            of a Maven package version is its <code>groupId</code>. </p> </li> <li> <p> The namespace of an npm package version is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet package 
            versions do not contain a corresponding component, package versions of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is its 
            <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the requested package version. '
        - name: version
          in: query
          type: string
          required: true
          description: ' A string that contains the package version (for example, <code>3.5.2</code>). '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: disposePackageVersions
        method: POST
        description: Amazon CodeArtifact Dispose Package Versions
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository you want to dispose. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that contains the package versions you want to dispose. '
        - name: format
          in: query
          type: string
          required: true
          description: ' A format that specifies the type of package versions you want to dispose. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package versions to be disposed. The package version component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The 
            namespace of a Maven package version is its <code>groupId</code>. </p> </li> <li> <p> The namespace of an npm package version is its <code>scope</code>. </p> </li> <li> <p> Python and 
            NuGet package versions do not contain a corresponding component, package versions of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is its 
            <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the package with the versions you want to dispose. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: getPackageVersionAsset
        method: GET
        description: Amazon CodeArtifact Get Package Version Asset
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository that contains the package version with the requested asset. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The repository that contains the package version with the requested asset. '
        - name: format
          in: query
          type: string
          required: true
          description: ' A format that specifies the type of the package version with the requested asset file. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package version with the requested asset file. The package version component that specifies its namespace depends on its type. For example:</p> <ul> <li>
            <p> The namespace of a Maven package version is its <code>groupId</code>. </p> </li> <li> <p> The namespace of an npm package version is its <code>scope</code>. </p> </li> <li> <p> Python 
            and NuGet package versions do not contain a corresponding component, package versions of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is 
            its <code>namespace</code>. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the package that contains the requested asset. '
        - name: version
          in: query
          type: string
          required: true
          description: ' A string that contains the package version (for example, <code>3.5.2</code>). '
        - name: asset
          in: query
          type: string
          required: true
          description: ' The name of the requested asset. '
        - name: revision
          in: query
          type: string
          required: false
          description: ' The name of the package version revision that contains the requested asset. '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getPackageVersionReadme
        method: GET
        description: Amazon CodeArtifact Get Package Version Readme
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository that contains the package version with the requested readme file. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The repository that contains the package with the requested readme file. '
        - name: format
          in: query
          type: string
          required: true
          description: ' A format that specifies the type of the package version with the requested readme file. '
        - name: namespace
          in: query
          type: string
          required: false
          description: <p>The namespace of the package version with the requested readme file. The package version component that specifies its namespace depends on its type. For example:</p> <ul> 
            <li> <p> The namespace of an npm package version is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet package versions do not contain a corresponding component, package versions
            of those formats do not have a namespace. </p> </li> </ul>
        - name: package
          in: query
          type: string
          required: true
          description: ' The name of the package version that contains the requested readme file. '
        - name: version
          in: query
          type: string
          required: true
          description: ' A string that contains the package version (for example, <code>3.5.2</code>). '
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: listPackageVersionAssets
        method: POST
        description: Amazon CodeArtifact List Package Version Assets
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: ' The name of the domain that contains the repository associated with the package version assets. '
        - name: domain-owner
          in: query
          type: string
          required: false
          description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        - name: repository
          in: query
          type: string
          required: true
          description: ' The name of the repository that contains the package that contains the requested package version assets. '
        - name: format
          in: query
          type: string
          required: true
          description: ' The format of the package that contains the requested package version assets. '
        - name: namespace
          in: query
