aid: amazon-codeartifact
name: Amazon CodeArtifact
description: >-
  Amazon CodeArtifact is a fully managed, secure artifact repository service that helps organizations store, publish,
  and share software packages used in their software development process. CodeArtifact works with popular build tools
  and package managers including npm, yarn, pip, twine, Maven, Gradle, NuGet, and more. It supports Cargo, generic,
  Maven, npm, NuGet, PyPI, Ruby, and Swift package formats and integrates natively with AWS IAM, AWS KMS, AWS
  CloudTrail, and Amazon EventBridge.
