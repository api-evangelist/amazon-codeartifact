apis:
  - aid: amazon-codeartifact:amazon-codeartifact-api
    name: Amazon CodeArtifact API
    description: >-
      The Amazon CodeArtifact REST API enables programmatic management of artifact repositories, domains, packages,
      and package versions. Manage domains and repositories, control permissions policies, publish and copy package
      versions, retrieve authorization tokens, and manage external connections to public package registries such as
      npmjs, PyPI, Maven Central, NuGet Gallery, and RubyGems.
