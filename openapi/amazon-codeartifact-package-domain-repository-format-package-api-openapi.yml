                DescribePackage484Example:
                  summary: Default DescribePackage 484 response
                  x-microcks-default: true
                  value: '500123'
      parameters:
      - name: domain
        in: query
        required: true
        description: The name of the domain that contains the repository that contains the package.
        schema:
          type: string
          pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
          minLength: 2
          maxLength: 50
      - name: domain-owner
        in: query
        required: false
        description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        schema:
          type: string
          pattern: '[0-9]{12}'
          minLength: 12
          maxLength: 12
      - name: repository
        in: query
        required: true
        description: 'The name of the repository that contains the requested package. '
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
          minLength: 2
          maxLength: 100
      - name: format
        in: query
        required: true
        description: A format that specifies the type of the requested package.
        schema:
          type: string
          enum:
          - npm
          - pypi
          - maven
          - nuget
          - generic
      - name: namespace
        in: query
        required: false
        description: <p>The namespace of the requested package. The package component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace of a Maven package is its <code>groupId</code>. The namespace is required when requesting Maven packages. </p> </li> <li> <p> The namespace of an npm package is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet packages do not contain a corresponding component, packages of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is its <code>namespace</code>. </p> </li> </ul>
        schema:
          type: string
          pattern: '[^#/\s]+'
          minLength: 1
          maxLength: 255
      - name: package
        in: query
        required: true
        description: The name of the requested package.
        schema:
          type: string
          pattern: '[^#/\s]+'
          minLength: 1
          maxLength: 255
      summary: Amazon CodeArtifact Describe Package
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Package#domain&repository&format&package
    post:
      operationId: PutPackageOriginConfiguration
      description: 'Sets the package origin configuration for a package.


        The package origin configuration determines how new versions of a package can be added to a repository. You can allow or block direct publishing of new package versions, or ingestion and retaining of new package versions from an external connection or upstream source. For more information about package origin controls and configuration, see Editing package origin controls in the CodeArtifact User Guide.


        PutPackageOriginConfiguration can be called on a package that doesn''t yet exist in the repository. When called on a package that does not exist, a package is created in the repository with no versions and the requested restrictions are set on the package. This can be used to preemptively block ingesting or retaining any versions from external connections or upstream repositories, or to block publishing any versions of the package into the repository before connecting any package managers or publishers to the repository.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutPackageOriginConfigurationResult'
              examples:
                PutPackageOriginConfiguration200Example:
                  summary: Default PutPackageOriginConfiguration 200 response
                  x-microcks-default: true
                  value:
                    originConfiguration: example-value
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                PutPackageOriginConfiguration480Example:
                  summary: Default PutPackageOriginConfiguration 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                PutPackageOriginConfiguration481Example:
                  summary: Default PutPackageOriginConfiguration 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                PutPackageOriginConfiguration482Example:
                  summary: Default PutPackageOriginConfiguration 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                PutPackageOriginConfiguration483Example:
                  summary: Default PutPackageOriginConfiguration 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PutPackageOriginConfiguration484Example:
                  summary: Default PutPackageOriginConfiguration 484 response
                  x-microcks-default: true
                  value: '500123'
      parameters:
      - name: domain
        in: query
        required: true
        description: The name of the domain that contains the repository that contains the package.
        schema:
          type: string
          pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
          minLength: 2
          maxLength: 50
      - name: domain-owner
        in: query
        required: false
        description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        schema:
          type: string
          pattern: '[0-9]{12}'
          minLength: 12
          maxLength: 12
      - name: repository
        in: query
        required: true
        description: The name of the repository that contains the package.
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
          minLength: 2
          maxLength: 100
      - name: format
        in: query
        required: true
        description: A format that specifies the type of the package to be updated.
        schema:
          type: string
          enum:
          - npm
          - pypi
          - maven
          - nuget
          - generic
      - name: namespace
        in: query
        required: false
        description: <p>The namespace of the package to be updated. The package component that specifies its namespace depends on its type. For example:</p> <ul> <li> <p> The namespace of a Maven package is its <code>groupId</code>. </p> </li> <li> <p> The namespace of an npm package is its <code>scope</code>. </p> </li> <li> <p> Python and NuGet packages do not contain a corresponding component, packages of those formats do not have a namespace. </p> </li> <li> <p> The namespace of a generic package is its <code>namespace</code>. </p> </li> </ul>
        schema:
          type: string
          pattern: '[^#/\s]+'
          minLength: 1
          maxLength: 255
      - name: package
        in: query
        required: true
        description: The name of the package to be updated.
        schema:
          type: string
          pattern: '[^#/\s]+'
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - restrictions
              properties:
                restrictions:
                  description: Details about the origin restrictions set on the package. The package origin restrictions determine how new versions of a package can be added to a specific repository.
                  type: object
                  properties:
                    publish:
                      allOf:
                      - $ref: '#/components/schemas/AllowPublish'
                      - description: The package origin configuration that determines if new versions of the package can be published directly to the repository.
                    upstream:
                      allOf:
                      - $ref: '#/components/schemas/AllowUpstream'
                      - description: The package origin configuration that determines if new versions of the package can be added to the repository from an external connection or upstream source.
            examples:
              PutPackageOriginConfigurationRequestExample:
                summary: Default PutPackageOriginConfiguration request
                x-microcks-default: true
                value:
                  restrictions:
                    publish: example-value
                    upstream: example-value
      summary: Amazon CodeArtifact Put Package Origin Configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Package#domain&repository&format&package
components:
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
