                  x-microcks-default: true
                  value: example-value
        '485':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                PutDomainPermissionsPolicy485Example:
                  summary: Default PutDomainPermissionsPolicy 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PutDomainPermissionsPolicy486Example:
                  summary: Default PutDomainPermissionsPolicy 486 response
                  x-microcks-default: true
                  value: '500123'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              - policyDocument
              properties:
                domain:
                  description: ' The name of the domain on which to set the resource policy. '
                  type: string
                  pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
                  minLength: 2
                  maxLength: 50
                domainOwner:
                  description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
                  type: string
                  pattern: '[0-9]{12}'
                  minLength: 12
                  maxLength: 12
                policyRevision:
                  description: ' The current revision of the resource policy to be set. This revision is used for optimistic locking, which prevents others from overwriting your changes to the domain''s resource policy. '
                  type: string
                  pattern: \S+
                  minLength: 1
                  maxLength: 100
                policyDocument:
                  description: ' A valid displayable JSON Aspen policy string to be set as the access control resource policy on the provided domain. '
                  type: string
                  pattern: '[\P{C}\s]+'
                  minLength: 1
                  maxLength: 7168
            examples:
              PutDomainPermissionsPolicyRequestExample:
                summary: Default PutDomainPermissionsPolicy request
                x-microcks-default: true
                value:
                  domain: my-domain
                  domainOwner: my-domain
                  policyRevision: example-value
                  policyDocument: example-value
