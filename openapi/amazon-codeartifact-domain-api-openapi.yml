  /v1/domain/permissions/policy:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    put:
      operationId: PutDomainPermissionsPolicy
      description: 'Sets a resource policy on a domain that specifies permissions to access it.


        When you call PutDomainPermissionsPolicy, the resource policy on the domain is ignored when evaluting permissions. This ensures that the owner of a domain cannot lock themselves out of the domain, which would prevent them from being able to update the resource policy.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutDomainPermissionsPolicyResult'
              examples:
                PutDomainPermissionsPolicy200Example:
                  summary: Default PutDomainPermissionsPolicy 200 response
                  x-microcks-default: true
                  value:
                    policy: example-value
        '480':
          description: AccessDeniedException
