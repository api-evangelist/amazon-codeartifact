                  summary: Default PutDomainPermissionsPolicy 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                PutDomainPermissionsPolicy482Example:
                  summary: Default PutDomainPermissionsPolicy 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ResourceNotFoundException
