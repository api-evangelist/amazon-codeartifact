components:
  schemas:
    RepositoryExternalConnectionInfoList:
      type: array
      items:
        $ref: '#/components/schemas/RepositoryExternalConnectionInfo'
    TagValue:
      type: string
      pattern: \P{C}*
      minLength: 0
      maxLength: 256
    ThrottlingException: {}
    RepositoryDescription:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/RepositoryName'
          - description: ' The name of the repository. '
        administratorAccount:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - description: ' The 12-digit account number of the Amazon Web Services account that manages the repository. '
        domainName:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: ' The name of the domain that contains the repository. '
        domainOwner:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - description: ' The 12-digit account number of the Amazon Web Services account that owns the domain that contains the repository. It does not include dashes or spaces. '
        arn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: ' The Amazon Resource Name (ARN) of the repository. '
        description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: ' A text description of the repository. '
        upstreams:
          allOf:
          - $ref: '#/components/schemas/UpstreamRepositoryInfoList'
          - description: ' A list of upstream repositories to associate with the repository. The order of the upstream repositories in the list determines their priority order when CodeArtifact looks for a requested package version. For more information, see <a href="https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html">Working with upstream repositories</a>. '
        externalConnections:
          allOf:
          - $ref: '#/components/schemas/RepositoryExternalConnectionInfoList'
          - description: ' An array of external connections associated with the repository. '
        createdTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A timestamp that represents the date and time the repository was created.
      description: ' The details of a repository stored in CodeArtifact. A CodeArtifact repository contains a set of package versions, each of which maps to a set of assets. Repositories are polyglot—a single repository can contain packages of any supported type. Each repository exposes endpoints for fetching and publishing packages using tools like the <code>npm</code> CLI, the Maven CLI (<code>mvn</code>), and <code>pip</code>. You can create up to 100 repositories per Amazon Web Services account. '
    ServiceQuotaExceededException: {}
    AccountId:
      type: string
      pattern: '[0-9]{12}'
      minLength: 12
      maxLength: 12
    TagKey:
      type: string
      pattern: \P{C}+
      minLength: 1
      maxLength: 128
    ConflictException: {}
    Arn:
      type: string
      pattern: \S+
      minLength: 1
      maxLength: 1011
    RepositoryName:
      type: string
      pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
      minLength: 2
      maxLength: 100
    ValidationException: {}
    Description:
      type: string
      pattern: \P{C}*
      maxLength: 1000
    PackageFormat:
      type: string
      enum:
      - npm
      - pypi
      - maven
      - nuget
      - generic
    DescribeRepositoryResult:
      type: object
      properties:
        repository:
          allOf:
          - $ref: '#/components/schemas/RepositoryDescription'
          - description: ' A <code>RepositoryDescription</code> object that contains the requested repository information. '
    ResourceNotFoundException: {}
    ExternalConnectionStatus:
      type: string
      enum:
      - Available
    InternalServerException: {}
    RepositoryExternalConnectionInfo:
      type: object
      properties:
        externalConnectionName:
          allOf:
          - $ref: '#/components/schemas/ExternalConnectionName'
          - description: ' The name of the external connection associated with a repository. '
        packageFormat:
          allOf:
          - $ref: '#/components/schemas/PackageFormat'
          - description: '<p> The package format associated with a repository''s external connection. The valid package formats are: </p> <ul> <li> <p> <code>npm</code>: A Node Package Manager (npm) package. </p> </li> <li> <p> <code>pypi</code>: A Python Package Index (PyPI) package. </p> </li> <li> <p> <code>maven</code>: A Maven package that contains compiled code in a distributable format, such as a JAR file. </p> </li> <li> <p> <code>nuget</code>: A NuGet package. </p> </li> </ul>'
        status:
          allOf:
          - $ref: '#/components/schemas/ExternalConnectionStatus'
          - description: ' The status of the external connection of a repository. There is one valid value, <code>Available</code>. '
      description: ' Contains information about the external connection of a repository. '
    ExternalConnectionName:
      type: string
      pattern: '[A-Za-z0-9][A-Za-z0-9._\-:]{1,99}'
      minLength: 2
      maxLength: 100
    UpstreamRepositoryInfoList:
      type: array
      items:
        $ref: '#/components/schemas/UpstreamRepositoryInfo'
    Tag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The tag key.
        value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The tag value.
      description: A tag is a key-value pair that can be used to manage, search for, or filter resources in CodeArtifact.
    UpdateRepositoryResult:
      type: object
      properties:
        repository:
          allOf:
          - $ref: '#/components/schemas/RepositoryDescription'
          - description: ' The updated repository. '
    UpstreamRepository:
      type: object
      required:
      - repositoryName
      properties:
        repositoryName:
          allOf:
          - $ref: '#/components/schemas/RepositoryName'
          - description: ' The name of an upstream repository. '
      description: ' Information about an upstream repository. A list of <code>UpstreamRepository</code> objects is an input parameter to <a href="https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_CreateRepository.html">CreateRepository</a> and <a href="https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_UpdateRepository.html">UpdateRepository</a>. '
    AccessDeniedException: {}
    UpstreamRepositoryInfo:
      type: object
      properties:
        repositoryName:
          allOf:
          - $ref: '#/components/schemas/RepositoryName'
          - description: ' The name of an upstream repository. '
      description: ' Information about an upstream repository. '
    CreateRepositoryResult:
      type: object
      properties:
        repository:
          allOf:
          - $ref: '#/components/schemas/RepositoryDescription'
          - description: ' Information about the created repository after processing the request. '
    DeleteRepositoryResult:
