      parameters:
      - name: domain
        in: query
        required: true
        description: ' The name of the domain that contains the created repository. '
        schema:
          type: string
          pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
          minLength: 2
          maxLength: 50
      - name: domain-owner
        in: query
        required: false
        description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        schema:
          type: string
          pattern: '[0-9]{12}'
          minLength: 12
          maxLength: 12
      - name: repository
        in: query
        required: true
        description: ' The name of the repository to create. '
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
          minLength: 2
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: ' A description of the created repository. '
                  type: string
                  pattern: \P{C}*
                  maxLength: 1000
                upstreams:
                  description: ' A list of upstream repositories to associate with the repository. The order of the upstream repositories in the list determines their priority order when CodeArtifact looks for a requested package version. For more information, see <a href="https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html">Working with upstream repositories</a>. '
                  type: array
                  items:
                    $ref: '#/components/schemas/UpstreamRepository'
                tags:
                  description: One or more tag key-value pairs for the repository.
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
                  minItems: 0
                  maxItems: 200
            examples:
              CreateRepositoryRequestExample:
                summary: Default CreateRepository request
                x-microcks-default: true
                value:
                  description: Example description for CodeArtifact resource
                  upstreams:
                  - repositoryName: my-repo
                  tags:
                  - key: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
                    value: example-value
      summary: Amazon CodeArtifact Create Repository
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Repository#domain&repository
