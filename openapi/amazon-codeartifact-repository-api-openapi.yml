                  summary: Default DisassociateExternalConnection 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                DisassociateExternalConnection483Example:
                  summary: Default DisassociateExternalConnection 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
