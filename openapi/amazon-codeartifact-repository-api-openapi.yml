                  x-microcks-default: true
                  value: example-value
        '485':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                DisassociateExternalConnection485Example:
                  summary: Default DisassociateExternalConnection 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                DisassociateExternalConnection486Example:
                  summary: Default DisassociateExternalConnection 486 response
                  x-microcks-default: true
                  value: '500123'
      parameters:
      - name: domain
        in: query
        required: true
        description: 'The name of the domain that contains the repository from which to remove the external repository. '
        schema:
          type: string
          pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
          minLength: 2
          maxLength: 50
      - name: domain-owner
        in: query
        required: false
        description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        schema:
          type: string
          pattern: '[0-9]{12}'
          minLength: 12
          maxLength: 12
      - name: repository
        in: query
        required: true
        description: 'The name of the repository from which the external connection will be removed. '
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
          minLength: 2
          maxLength: 100
      - name: external-connection
        in: query
        required: true
        description: 'The name of the external connection to be removed from the repository. '
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-:]{1,99}'
          minLength: 2
          maxLength: 100
      summary: Amazon CodeArtifact Disassociate External Connection
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Repository
  /v1/repository/permissions/policies#domain&repository:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
