- hmac: []
tags:
- name: Repository
paths:
  /v1/repository/external-connection#domain&repository&external-connection:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: AssociateExternalConnection
      description: 'Adds an existing external connection to a repository. One external connection is allowed per repository.


        A repository can have one or more upstream repositories, or an external connection.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateExternalConnectionResult'
              examples:
                AssociateExternalConnection200Example:
                  summary: Default AssociateExternalConnection 200 response
                  x-microcks-default: true
                  value:
                    repository: my-repo
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                AssociateExternalConnection480Example:
                  summary: Default AssociateExternalConnection 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
              examples:
                AssociateExternalConnection481Example:
                  summary: Default AssociateExternalConnection 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                AssociateExternalConnection482Example:
                  summary: Default AssociateExternalConnection 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                AssociateExternalConnection483Example:
                  summary: Default AssociateExternalConnection 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
              examples:
                AssociateExternalConnection484Example:
                  summary: Default AssociateExternalConnection 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                AssociateExternalConnection485Example:
                  summary: Default AssociateExternalConnection 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                AssociateExternalConnection486Example:
                  summary: Default AssociateExternalConnection 486 response
                  x-microcks-default: true
                  value: '500123'
      parameters:
      - name: domain
        in: query
        required: true
        description: The name of the domain that contains the repository.
        schema:
          type: string
          pattern: '[a-z][a-z0-9\-]{0,48}[a-z0-9]'
          minLength: 2
          maxLength: 50
      - name: domain-owner
        in: query
        required: false
        description: ' The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces. '
        schema:
          type: string
          pattern: '[0-9]{12}'
          minLength: 12
          maxLength: 12
      - name: repository
        in: query
        required: true
        description: ' The name of the repository to which the external connection is added. '
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-]{1,99}'
          minLength: 2
          maxLength: 100
      - name: external-connection
        in: query
        required: true
        description: '<p> The name of the external connection to add to the repository. The following values are supported: </p> <ul> <li> <p> <code>public:npmjs</code> - for the npm public repository. </p> </li> <li> <p> <code>public:nuget-org</code> - for the NuGet Gallery. </p> </li> <li> <p> <code>public:pypi</code> - for the Python Package Index. </p> </li> <li> <p> <code>public:maven-central</code> - for Maven Central. </p> </li> <li> <p> <code>public:maven-googleandroid</code> - for the Google Android repository. </p> </li> <li> <p> <code>public:maven-gradleplugins</code> - for the Gradle plugins repository. </p> </li> <li> <p> <code>public:maven-commonsware</code> - for the CommonsWare Android repository. </p> </li> <li> <p> <code>public:maven-clojars</code> - for the Clojars repository. </p> </li> </ul>'
        schema:
          type: string
          pattern: '[A-Za-z0-9][A-Za-z0-9._\-:]{1,99}'
          minLength: 2
          maxLength: 100
      summary: Amazon CodeArtifact Associate External Connection
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Repository
    delete:
      operationId: DisassociateExternalConnection
      description: Removes an existing external connection from a repository.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisassociateExternalConnectionResult'
              examples:
                DisassociateExternalConnection200Example:
                  summary: Default DisassociateExternalConnection 200 response
                  x-microcks-default: true
                  value:
                    repository: my-repo
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                DisassociateExternalConnection480Example:
